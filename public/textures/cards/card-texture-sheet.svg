<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gold Guilloche Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="25%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#aa7c11"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
    <linearGradient id="dragonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="tigerAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="guilloche" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q5,0 10,10 T20,10" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" opacity="0.6"/>
      <path d="M0,10 Q5,20 10,10 T20,10" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="#07090e"/>

  <!-- Quadrant 1: Dragon Card Texture Face -->
  <g transform="translate(32, 32)">
    <rect width="464" height="464" rx="24" fill="#0f172a" stroke="url(#goldFoil)" stroke-width="4"/>
    <rect x="16" y="16" width="432" height="432" rx="16" fill="url(#dragonRed)" opacity="0.2"/>
    <rect x="16" y="16" width="432" height="432" rx="16" fill="url(#guilloche)"/>
    <circle cx="232" cy="232" r="110" fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="232" y="260" font-family="monospace, sans-serif" font-size="96" font-weight="900" text-anchor="middle" fill="#ef4444">🐉</text>
    <text x="232" y="370" font-family="monospace, sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="url(#goldFoil)" letter-spacing="6">DRAGON CARD</text>
  </g>

  <!-- Quadrant 2: Tiger Card Texture Face -->
  <g transform="translate(528, 32)">
    <rect width="464" height="464" rx="24" fill="#0f172a" stroke="url(#goldFoil)" stroke-width="4"/>
    <rect x="16" y="16" width="432" height="432" rx="16" fill="url(#tigerAmber)" opacity="0.2"/>
    <rect x="16" y="16" width="432" height="432" rx="16" fill="url(#guilloche)"/>
    <circle cx="232" cy="232" r="110" fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="232" y="260" font-family="monospace, sans-serif" font-size="96" font-weight="900" text-anchor="middle" fill="#f59e0b">🐯</text>
    <text x="232" y="370" font-family="monospace, sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="url(#goldFoil)" letter-spacing="6">TIGER CARD</text>
  </g>

  <!-- Quadrant 3: Master Deck Card Back Texture -->
  <g transform="translate(32, 528)">
    <rect width="464" height="464" rx="24" fill="#0a0d14" stroke="url(#goldFoil)" stroke-width="4"/>
    <rect x="16" y="16" width="432" height="432" rx="16" fill="url(#guilloche)"/>
    <rect x="24" y="24" width="416" height="416" rx="12" fill="none" stroke="url(#goldFoil)" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="232" cy="232" r="90" fill="#0a0d14" stroke="url(#goldFoil)" stroke-width="3"/>
    <text x="232" y="248" font-family="monospace, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="url(#goldFoil)">APEX</text>
  </g>

  <!-- Quadrant 4: Card Indices & Holographic Foil Sheet -->
  <g transform="translate(528, 528)">
    <rect width="464" height="464" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="48" y="80" font-family="serif" font-size="56" font-weight="bold" fill="#dc2626">A ♥</text>
    <text x="416" y="420" font-family="serif" font-size="56" font-weight="bold" fill="#dc2626" text-anchor="end">A ♥</text>
    <text x="232" y="260" font-family="serif" font-size="140" text-anchor="middle" fill="#dc2626">♥</text>
  </g>
</svg>